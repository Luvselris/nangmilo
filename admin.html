<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard ♡ Nangmilo</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --color-charcoal: #545258;
      --color-grey-soft: #8e8b94;
      --color-blush-pink: #ebdbe3;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-color: rgba(181, 140, 164, 0.4);
      --text: #2f2d33;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body {
      background: radial-gradient(circle at top, #faf8f9 0%, #f4f1f2 50%, #e7e2e6 100%);
      color: var(--text); min-height: 100vh; padding: 20px 14px 60px; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 480px; }
    .card {
      background: var(--card-bg); border-radius: 24px; padding: 20px;
      box-shadow: 0 10px 25px rgba(84, 82, 88, 0.1); border: 1.5px solid #fff; margin-bottom: 16px;
    }
    .title { font-size: 18px; font-weight: 700; color: var(--color-charcoal); text-align: center; margin-bottom: 14px; }
    .field-group { margin-bottom: 12px; }
    .field-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: block; }
    .input-box, .textarea-box {
      width: 100%; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--border-color);
      outline: none; font-size: 13.5px; background: #fff;
    }
    .input-box:focus, .textarea-box:focus { border-color: var(--color-charcoal); }
    .textarea-box { min-height: 80px; resize: vertical; }

    .nav-tabs {
      display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; padding: 9px 12px; border: none; border-radius: 16px;
      background: #ffffff; color: var(--text); font-weight: 600; cursor: pointer;
      border: 1px solid var(--border-color); font-size: 12.5px;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--color-charcoal), #3b3940);
      color: #fff; border-color: transparent;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .app-admin-card {
      background: #fff; border: 1.5px solid var(--border-color); border-radius: 18px;
      padding: 14px; margin-bottom: 12px;
    }
    .plan-stock-card {
      background: #faf8f9; border: 1px dashed var(--color-grey-soft); border-radius: 12px;
      padding: 10px; margin-top: 8px;
    }

    .btn {
      width: 100%; padding: 12px; border-radius: 18px; border: none; font-size: 14.5px;
      font-weight: 700; cursor: pointer; background: linear-gradient(135deg, var(--color-charcoal), #38363d);
      color: #fff; box-shadow: 0 4px 14px rgba(84, 82, 88, 0.25); margin-top: 8px;
    }
    .btn-secondary {
      background: #fff; color: var(--color-charcoal); border: 1.5px solid var(--border-color); box-shadow: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- ล็อกอินแอดมิน: ใช้ label email & password ไม่เผยข้อมูลจริง -->
  <div class="card" id="loginBox">
    <div class="title">🔐 ระบบหลังบ้าน ♡ Nangmilo</div>
    <div class="field-group">
      <label class="field-label">email</label>
      <input type="text" id="loginEmail" class="input-box" placeholder="email">
    </div>
    <div class="field-group">
      <label class="field-label">password</label>
      <input type="password" id="loginPassword" class="input-box" placeholder="password">
    </div>
    <button type="button" class="btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
  </div>

  <!-- แผงแดชบอร์ด -->
  <div id="dashboardBox" class="hidden">
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" onclick="switchAdminTab('general')">1. ร้านค้า</button>
      <button type="button" class="tab-btn" onclick="switchAdminTab('apps')">2. แอพ & สต็อก</button>
      <button type="button" class="tab-btn" onclick="switchAdminTab('wallet')">3. เติมเงินแอดมิน</button>
      <button type="button" class="tab-btn" onclick="switchAdminTab('account')">4. บัญชี & รหัส</button>
    </div>

    <!-- แถบ 1: ข้อมูลหน้าร้าน -->
    <div class="tab-content active" id="tab-general">
      <div class="card">
        <div class="title">🌸 ข้อมูลโปรไฟล์ร้าน</div>
        <div class="field-group">
          <label class="field-label">ชื่อร้าน</label>
          <input type="text" id="cfgShopName" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">คำอธิบายร้าน (Bio)</label>
          <textarea id="cfgShopBio" class="textarea-box"></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">URL รูปแบนเนอร์ (GIF/JPG)</label>
          <input type="text" id="cfgBanner" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL รูปโปรไฟล์</label>
          <input type="text" id="cfgProfile" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL เพลง (.mp3)</label>
          <input type="text" id="cfgMusic" class="input-box">
        </div>
        <button type="button" class="btn" onclick="saveGeneralConfig()">บันทึกข้อมูลหน้าร้าน</button>
      </div>
    </div>

    <!-- แถบ 2: จัดการแอพ & สต็อก -->
    <div class="tab-content" id="tab-apps">
      <div class="card">
        <div class="title">📱 จัดการกล่องแอพ & เติมแบบฟอร์มสต็อก</div>
        <div id="appsListContainer"></div>
        <button type="button" class="btn btn-secondary" onclick="addNewAppBox()">+ เพิ่มกล่องแอพพรีเมี่ยมใหม่</button>
        <button type="button" class="btn" onclick="saveAllApps()">บันทึกรายการแอพ & สต็อกทั้งหมด</button>
      </div>
    </div>

    <!-- แถบ 3: เติมเงินให้บัญชีสมาชิก -->
    <div class="tab-content" id="tab-wallet">
      <div class="card">
        <div class="title">💰 เติมเงินเข้ากระเป๋าบัญชีผู้ใช้ (อิสระ)</div>
        <div class="field-group">
          <label class="field-label">ชื่อผู้ใช้ (Username) ที่ต้องการเติมเงิน</label>
          <input type="text" id="targetUsername" class="input-box" placeholder="กรอก username">
        </div>
        <div class="field-group">
          <label class="field-label">จำนวนเงินที่ต้องการเติม (บาท)</label>
          <input type="number" id="addBalanceAmount" class="input-box" placeholder="เช่น 500 หรือ 9999">
        </div>
        <button type="button" class="btn" onclick="adminAddBalance()">⚡ เติมเงินเข้าระบบทันที</button>
      </div>
    </div>

    <!-- แถบ 4: เปลี่ยนรหัสผ่าน -->
    <div class="tab-content" id="tab-account">
      <div class="card">
        <div class="title">🔑 บัญชีและความปลอดภัยแอดมิน</div>
        <div class="field-group">
          <label class="field-label">email แอดมิน</label>
          <input type="email" id="adminEmailInput" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">รหัสผ่านใหม่</label>
          <input type="password" id="newAdminPass" class="input-box" placeholder="ปล่อยว่างหากไม่เปลี่ยน">
        </div>
        <button type="button" class="btn" onclick="updateAdminPass()">บันทึกรหัสผ่านใหม่</button>
        <button type="button" class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
      </div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
    authDomain: "benefitie.firebaseapp.com",
    projectId: "benefitie",
    storageBucket: "benefitie.firebasestorage.app",
    messagingSenderId: "270365672215",
    appId: "1:270365672215:web:230d1491091e26ce83ed52"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const DB_SITE = "nangmilo_site_config";
  const DB_APPS = "nangmilo_shop_apps";
  const DB_USERS = "nangmilo_shop_users";

  let adminUsername = "moonlightbae";
  let adminEmail = "Gplusgplus500@gmail.com";
  let adminPass = "Meow4U!7";
  let appsEditData = [];

  const FORM_SEPARATOR = "\n===\n";

  db.collection(DB_SITE).doc("admin").onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.username) adminUsername = d.username;
      if (d.email) adminEmail = d.email;
      if (d.pass) adminPass = d.pass;
    }
  });

  function handleLogin() {
    const inputVal = document.getElementById('loginEmail').value.trim();
    const p = document.getElementById('loginPassword').value.trim();
    
    const isUserMatch = (inputVal === adminUsername || inputVal.toLowerCase() === adminEmail.toLowerCase());
    
    if (isUserMatch && p === adminPass) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashboardBox').classList.remove('hidden');
      loadAllAdminData();
    } else {
      alert('email หรือ password ไม่ถูกต้องค่ะ');
    }
  }

  function switchAdminTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  function loadAllAdminData() {
    document.getElementById('adminEmailInput').value = adminEmail;

    db.collection(DB_SITE).doc("config").get().then(doc => {
      const d = doc.exists ? doc.data() : {};
      document.getElementById('cfgShopName').value = d.shopName || "Nangmilo";
      document.getElementById('cfgShopBio').value = d.shopBio || `สวัสดีค่าเว็ปร้านนังไมโลเองงย้ายมาในนี้ หลังซื้อขายบริการฝาก+1ให้ทีนะคะ ขอบคุณมากๆที่สนับสนุนร้านเราค่ะ รับทำป้ายเครดิต ป้ายidentity v ป้ายต่างๆสามารถสอบถามเพิ่มเติมได้ค่า\nมีปัญหาแจ้งไลน์ siamfineshyt  ไม่มี @ ค่ะ ♡`;
      // กำหนดค่าเริ่มต้นให้ตรงกับรูปใหม่
      document.getElementById('cfgBanner').value = d.bannerImg || "https://files.catbox.moe/qfm6ke.gif";
      document.getElementById('cfgProfile').value = d.profileImg || "https://files.catbox.moe/eugyqk.jpeg";
      document.getElementById('cfgMusic').value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/Ariana%20Grande%20-%20intro%20(end%20of%20the%20world)%20(extended)%20(lyric%20visualizer).mp3";
    });

    db.collection(DB_APPS).orderBy("order", "asc").get().then(snap => {
      if (!snap.empty) {
        appsEditData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      } else {
        appsEditData = [
          {
            name: "netflix",
            thumb: "https://files.catbox.moe/kszmeo.jpeg",
            desc: "โดนปิดไม่รับเคลมถ้าไม่ซื้อแบบเคลม ♡",
            order: 0,
            plans: [
              { name: "1 day", price: 10, stock: [] },
              { name: "7 day", price: 35, stock: [] },
              { name: "30 day", price: 105, stock: [] }
            ]
          },
          {
            name: "youtube",
            thumb: "https://files.catbox.moe/o8wqpz.jpeg",
            desc: "",
            order: 1,
            plans: [
              { name: "30 d ไม่ต่อเมล", price: 20, stock: [] },
              { name: "30 d เคลม", price: 25, stock: [] }
            ]
          }
        ];
      }
      renderAppsEditor();
    });
  }

  function renderAppsEditor() {
    const box = document.getElementById('appsListContainer');
    box.innerHTML = '';

    appsEditData.forEach((app, aIdx) => {
      const card = document.createElement('div');
      card.className = 'app-admin-card';

      let plansHtml = '';
      (app.plans || []).forEach((p, pIdx) => {
        const stockStr = (p.stock || []).join(FORM_SEPARATOR);
        plansHtml += `
          <div class="plan-stock-card">
            <div style="display:flex; gap:6px; margin-bottom:4px;">
              <input type="text" class="input-box" value="${p.name}" style="flex:2;" placeholder="ชื่อแพ็กเกจ" oninput="appsEditData[${aIdx}].plans[${pIdx}].name=this.value">
              <input type="number" class="input-box" value="${p.price}" style="flex:1;" placeholder="ราคา (฿)" oninput="appsEditData[${aIdx}].plans[${pIdx}].price=parseFloat(this.value)||0">
              <button type="button" style="background:#fee2e2; border:none; color:#ef4444; border-radius:10px; padding:0 8px;" onclick="removePlan(${aIdx}, ${pIdx})">✕</button>
            </div>
            <label style="font-size:11.5px; color:#475569; font-weight:700;">
              📝 วางแบบฟอร์มส่งรหัสยาวๆ ได้เลย (หากมีหลายฟอร์มให้คั่นด้วย ===):
            </label>
            <textarea class="textarea-box" style="font-size:12px; font-family:monospace; min-height:120px; white-space:pre;" placeholder="วางแบบฟอร์มส่งรหัสที่นี่ได้ยาวๆ เลยค่ะ..." oninput="updateStock(${aIdx}, ${pIdx}, this.value)">${stockStr}</textarea>
            <div style="font-size:11px; color:#64748b; margin-top:2px;">
              คงเหลือในสต็อก: <strong style="color:var(--color-charcoal);">${(p.stock || []).length}</strong> ชุด
            </div>
          </div>
        `;
      });

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong style="color:var(--color-charcoal);">กล่องแอพที่ ${aIdx+1}</strong>
          <button type="button" style="background:#fee2e2; border:none; color:#ef4444; border-radius:10px; padding:4px 8px; font-size:12px;" onclick="deleteApp(${aIdx})">ลบแอพนี้</button>
        </div>
        <div class="field-group">
          <label class="field-label">ชื่อแอพ</label>
          <input type="text" class="input-box" value="${app.name}" oninput="appsEditData[${aIdx}].name=this.value">
        </div>
        <div class="field-group">
          <label class="field-label">URL รูปปกแอพ</label>
          <input type="text" class="input-box" value="${app.thumb}" oninput="appsEditData[${aIdx}].thumb=this.value">
        </div>
        <div class="field-group">
          <label class="field-label">คำอธิบายเมื่อกดเข้าไป</label>
          <input type="text" class="input-box" value="${app.desc || ''}" oninput="appsEditData[${aIdx}].desc=this.value">
        </div>
        
        <label class="field-label" style="margin-top:10px;">📦 แพ็กเกจ & แบบฟอร์มสต็อก:</label>
        ${plansHtml}
        <button type="button" class="btn btn-secondary" style="padding:8px; font-size:12px; margin-top:8px;" onclick="addPlanToApp(${aIdx})">+ เพิ่มแพ็กเกจย่อย</button>
      `;
      box.appendChild(card);
    });
  }

  function updateStock(aIdx, pIdx, text) {
    if (!text || !text.trim()) {
      appsEditData[aIdx].plans[pIdx].stock = [];
      return;
    }
    const forms = text.split(/\n?===\n?/).map(s => s.trim()).filter(s => s.length > 0);
    appsEditData[aIdx].plans[pIdx].stock = forms;
  }

  function addPlanToApp(aIdx) {
    appsEditData[aIdx].plans.push({ name: "แพ็กเกจใหม่", price: 10, stock: [] });
    renderAppsEditor();
  }

  function removePlan(aIdx, pIdx) {
    appsEditData[aIdx].plans.splice(pIdx, 1);
    renderAppsEditor();
  }

  function addNewAppBox() {
    appsEditData.push({
      name: "แอพใหม่",
      thumb: "https://files.catbox.moe/kszmeo.jpeg",
      desc: "",
      order: appsEditData.length,
      plans: [{ name: "30 day", price: 50, stock: [] }]
    });
    renderAppsEditor();
  }

  function deleteApp(aIdx) {
    if (confirm("ต้องการลบกล่องแอพนี้ใช่ไหมคะ?")) {
      appsEditData.splice(aIdx, 1);
      renderAppsEditor();
    }
  }

  async function adminAddBalance() {
    const uName = document.getElementById('targetUsername').value.trim();
    const amount = parseFloat(document.getElementById('addBalanceAmount').value.trim());

    if (!uName) return alert('กรุณากรอกชื่อผู้ใช้ที่ต้องการเติมเงินค่ะ');
    if (!amount || isNaN(amount) || amount <= 0) return alert('กรุณากรอกจำนวนเงินให้ถูกต้องค่ะ');

    const uRef = db.collection(DB_USERS).doc(uName);
    const snap = await uRef.get();

    if (!snap.exists) {
      return alert(`ไม่พบผู้ใช้ "${uName}" ในระบบ กรุณาตรวจสอบชื่อผู้ใช้ใหม่อีกครั้งค่ะ`);
    }

    const curBal = snap.data().balance || 0;
    const newBal = curBal + amount;

    await uRef.update({ balance: newBal });
    alert(`เติมเงินให้คุณ "${uName}" เรียบร้อยแล้วค่ะ!\nจำนวนเงิน: +฿${amount.toFixed(2)}\nยอดคงเหลือใหม่: ฿${newBal.toFixed(2)} ♡`);
    document.getElementById('addBalanceAmount').value = '';
  }

  async function saveGeneralConfig() {
    const payload = {
      shopName: document.getElementById('cfgShopName').value.trim(),
      shopBio: document.getElementById('cfgShopBio').value.trim(),
      bannerImg: document.getElementById('cfgBanner').value.trim(),
      profileImg: document.getElementById('cfgProfile').value.trim(),
      musicUrl: document.getElementById('cfgMusic').value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection(DB_SITE).doc("config").set(payload, { merge: true });
    alert("บันทึกข้อมูลหน้าร้านเรียบร้อยแล้วค่ะ ♡");
  }

  async function saveAllApps() {
    const batch = db.batch();
    const snap = await db.collection(DB_APPS).get();
    snap.docs.forEach(d => batch.delete(d.ref));

    appsEditData.forEach((app, idx) => {
      const ref = db.collection(DB_APPS).doc(`app_${idx}`);
      batch.set(ref, {
        name: app.name,
        thumb: app.thumb,
        desc: app.desc || "",
        order: idx,
        plans: app.plans || []
      });
    });

    await batch.commit();
    alert("บันทึกรายการแอพและแบบฟอร์มสต็อกทั้งหมดขึ้นระบบเรียบร้อยแล้วค่ะ ♡");
  }

  async function updateAdminPass() {
    const newEmail = document.getElementById('adminEmailInput').value.trim();
    const np = document.getElementById('newAdminPass').value.trim();
    
    const payload = {};
    if (newEmail) {
      payload.email = newEmail;
      adminEmail = newEmail;
    }
    if (np) {
      payload.pass = np;
      adminPass = np;
    }

    if (Object.keys(payload).length === 0) return alert("ไม่มีข้อมูลที่เปลี่ยนแปลงค่ะ");

    await db.collection(DB_SITE).doc("admin").set(payload, { merge: true });
    document.getElementById('newAdminPass').value = '';
    alert("บันทึกข้อมูลความปลอดภัยเรียบร้อยแล้วค่ะ ♡");
  }

  function logout() {
    document.getElementById('dashboardBox').classList.add('hidden');
    document.getElementById('loginBox').classList.remove('hidden');
    document.getElementById('loginPassword').value = '';
  }
</script>
</body>
</html>
